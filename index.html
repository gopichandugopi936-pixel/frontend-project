<title>Web Technology Practical Programs</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a, #1e3a8a, #312e81);
    color: white;
}

header {
    text-align: center;
    padding: 50px 20px 30px;
}

header h1 {
    font-size: clamp(30px, 5vw, 52px);
    margin-bottom: 10px;
}

header p {
    color: #dbeafe;
    font-size: 17px;
}

.container {
    width: min(1200px, 94%);
    margin: auto;
    padding-bottom: 50px;
}

.stats {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin: 20px 0 30px;
}

.stat {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 12px 20px;
    border-radius: 14px;
}

.toolbar {
    position: sticky;
    top: 10px;
    z-index: 5;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    background: rgba(15,23,42,0.9);
    padding: 14px;
    border-radius: 16px;
    margin-bottom: 30px;
}

input,
select {
    flex: 1;
    min-width: 220px;
    padding: 13px 15px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
}

.section {
    margin: 30px 0;
}

.section h2 {
    font-size: 28px;
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 2px solid rgba(255,255,255,0.2);
}

.group {
    margin: 18px 0;
}

.group h3 {
    font-size: 19px;
    color: #bfdbfe;
    margin-bottom: 12px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
}

.card {
    display: block;
    text-decoration: none;
    color: white;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 13px;
    padding: 16px;
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-3px);
    background: rgba(255,255,255,0.18);
}

.number {
    font-size: 12px;
    color: #93c5fd;
    margin-bottom: 7px;
}

.name {
    font-weight: bold;
    font-size: 15px;
}

.path {
    font-size: 11px;
    color: #cbd5e1;
    margin-top: 8px;
    word-break: break-all;
}

.empty {
    display: none;
    text-align: center;
    padding: 40px;
    color: #cbd5e1;
}

footer {
    text-align: center;
    color: #cbd5e1;
    padding: 25px;
}
</style>
</head>
